<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Pluma - Faça login para acessar sua jornada de bem-estar emocional.">
    <meta name="theme-color" content="#9DC183">
    
    <title>Pluma - Login</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-page">
    <div class="login-container" style="justify-content: center; min-height: 100vh;">
        <!-- Logo e Header -->
        <div class="login-header">
            <div class="login-logo">
                <i class="fas fa-feather-alt"></i>
            </div>
            <h1 class="login-title">Bem-vindo à Pluma</h1>
            <p class="login-subtitle">Sua jornada de bem-estar emocional começa aqui. Escolha uma opção para continuar:</p>
        </div>

        <!-- Login com email e senha (back-end: /v1/auth/login e /v1/auth/register) -->
        <form class="login-form" id="loginForm" novalidate>
            <div class="form-group" id="nameGroup" hidden>
                <div class="input-icon-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" class="form-input" id="loginName" placeholder="Seu nome (opcional)" maxlength="100" autocomplete="name">
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="form-input" id="loginEmail" placeholder="Email" maxlength="100" autocomplete="email" required>
                </div>
            </div>
            <div class="form-group">
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="form-input" id="loginPassword" placeholder="Senha" maxlength="64" autocomplete="current-password" required>
                    <button type="button" class="password-toggle" id="passwordToggle" aria-label="Mostrar senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p class="form-error" id="loginError" role="alert"></p>
            </div>
            <button type="submit" class="btn btn-primary login-btn" id="loginSubmit">Entrar</button>
            <p class="register-link">
                <span id="toggleText">Ainda não tem conta?</span>
                <a href="#" id="toggleMode">Criar conta</a>
            </p>
        </form>

        <div class="login-divider">
            <span></span>
            <p>ou</p>
            <span></span>
        </div>

        <!-- Login Social -->
        <div class="social-login" style="flex-direction: column; gap: 1rem; margin-bottom: 2rem;">
            <!-- Botão oficial do Google (Google Identity Services). Aparece no lugar do botão abaixo quando o Client ID está configurado em js/api.js -->
            <div id="googleButton" style="display: none; justify-content: center;"></div>
            <button class="social-btn google" id="googleLogin" style="padding: 1rem; font-size: 1rem;">
                <i class="fab fa-google"></i>
                Continuar com o Google
            </button>
            <p class="form-error" id="socialError" role="alert" style="text-align: center;"></p>
        </div>

        <!-- Aviso -->
        <div class="disclaimer">
            <p class="disclaimer-text" style="font-size: 0.75rem;">
                Ao entrar, você concorda com nossos Termos de Uso e Política de Privacidade.
            </p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/api.js?v=4"></script>
    <script src="js/login.js?v=4"></script>
</body>
</html>
